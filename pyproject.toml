[project]
name = "text2sql-agent"
version = "1.1.0"
description = "A guardrailed metadata-driven Text-to-SQL agent for ERP data, powered by Groq API."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Guilherme Senis Fernandes" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
